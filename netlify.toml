# Netlify deploy config. See docs/DEPLOY.md for the walkthrough.
# The @netlify/plugin-nextjs runtime is auto-installed by Netlify when `next`
# is a dependency and handles the App Router (SSR routes, API routes, image
# optimization). No extra plugin block needed.
#
# Prisma engine selection is driven by `binaryTargets` in prisma/schema.prisma
# (native + debian-openssl-3.0.x + rhel-openssl-3.0.x) — do NOT also set
# PRISMA_CLI_BINARY_TARGETS here; the env var overrides the schema and rejects
# the "native" entry.

[build]
  command = "npm run build"

[functions]
  node_bundler = "esbuild"
  # Force the generated Prisma client + its native query engines into the
  # function bundle (the Linux `.so.node` files aren't always traced).
  included_files = [
    "node_modules/.prisma/client/**",
    "node_modules/@prisma/client/**",
  ]

# The daily job runs as a scheduled function (netlify/functions/daily-tasks.mjs),
# which calls /api/cron/evaluate with CRON_SECRET.
